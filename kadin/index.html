<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light only">
<title>Namaz Bahçesi yeni adresinde</title>
<link rel="canonical" href="https://namazbahcesi.com/">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#f6f1e9;color:#2e2a26;font:17px/1.5 system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
h1{font:700 30px/1.15 Georgia,serif;margin:0}
a.b{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:999px;background:#b8506b;color:#fff;font-weight:700;text-decoration:none}
small{color:#6c645c}
</style>
</head>
<body>
<h1>Namaz Bahçesi taşındı</h1>
<p>Yeni adresimiz: <b>namazbahcesi.com</b><br>İşaretlemelerin de seninle geliyor, birkaç saniye içinde yönlendiriliyorsun…</p>
<a class="b" id="go" href="https://namazbahcesi.com/">Yeni adrese git</a>
<small>Bir dahaki sefere doğrudan namazbahcesi.com adresini açabilirsin.</small>
<script>
(function(){
  var NEW='https://namazbahcesi.com/';
  var PAGE='kadin';
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function obj(k){try{return JSON.parse(get(k)||'null')}catch(e){return null}}
  var h=location.hash||'';
  if(!/^#[a-z0-9\-]*$/.test(h))h='';
  var s=get('namazSecim');
  var b=obj('namazBahcem40_v1'),f=obj('namazFidanim40_v1');
  if(!s&&b)s='kadin';if(!s&&f)s='erkek';
  var to;
  if(PAGE==='kadin'||PAGE==='erkek'){to=PAGE+'/index.html'+(h==='#sec'?'':h)}
  else if(h==='#sec'||!s){to='index.html'+(h==='#sec'?'#sec':'')}
  else{to=s+'/index.html'+h}
  var url=NEW+'index.html';
  if(b||f||s){
    var p={to:to,s:s,b:b,f:f};
    try{url=NEW+'tasi.html#'+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(p)))))}catch(e){url=NEW+to}
  }else{url=NEW+to}
  document.getElementById('go').href=url;
  var done=false;
  function go(){if(done)return;done=true;location.replace(url)}
  try{
    var jobs=[];
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
    }
    if(window.caches&&caches.keys){
      jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
    }
    Promise.all(jobs).then(go,go);
  }catch(e){}
  setTimeout(go,900);
})();
</script>
</body>
</html>
